name: Markdown integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-markdown:
    name: Check generated documentation
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate localized Markdown artifacts
        shell: cmd
        run: .python\check_markdown.bat

      - name: Verify deterministic launcher artwork
        run: |
          python -m pip install Pillow==12.3.0
          python .python/generate_launcher_icons.py --check
          python -m unittest discover -s .python/tests
