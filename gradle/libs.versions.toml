[versions]

# Eclipse Angus Mail (roadmap D2): the org.eclipse.angus:jakarta.mail bundle carries the Jakarta Mail
# 2.1 API together with the implementation; angus-activation implements the Jakarta Activation 2.1 API.
angus-mail = "2.0.5"
angus-activation = "2.0.3"
jakarta-activation-api = "2.1.4"

# Local IMAP / SMTP / POP3 server for the :mail-core JVM tests (roadmap D22); test scope only.
greenmail = "2.1.13"
slf4j = "2.0.19"

appcompat = "1.7.1"
commons-compress = "1.28.0"
desugar = "2.1.5"
foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
kotlinx-serialization = "1.11.0"
material = "1.13.0"
test-junit-version = "1.3.0"
test-rules = "1.7.0"
test-runner = "1.7.0"
xz = "1.10"

[libraries]

angus-activation = { module = "org.eclipse.angus:angus-activation", version.ref = "angus-activation" }
angus-jakarta-mail = { module = "org.eclipse.angus:jakarta.mail", version.ref = "angus-mail" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
apache-commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
jakarta-activation-api = { module = "jakarta.activation:jakarta.activation-api", version.ref = "jakarta-activation-api" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
material = { module = "com.google.android.material:material", version.ref = "material" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit-version" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
tukaani-xz = { module = "org.tukaani:xz", version.ref = "xz" }

[plugins]

foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
